name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  web:
    name: TypeScript – lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python – ruff, pyright, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            apps/api/requirements.txt
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install (CPU PyTorch; GPU tests are skipped in CI)
        run: |
          python -m venv .venv
          .venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r apps/worker/requirements.txt -r requirements-dev.txt
          .venv/bin/pip install --force-reinstall --no-deps opencv-python-headless
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pyright
      - run: .venv/bin/python -m pytest

  e2e:
    name: Playwright – renderer parity and end-to-end
    runs-on: ubuntu-latest
    needs: [web, python]
    timeout-minutes: 40
    env:
      # Playwright's Chromium has no H.264 decoder, so the worker makes VP9 proxies.
      PROXY_CODEC: vp9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            apps/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r apps/worker/requirements.txt
          .venv/bin/pip install --force-reinstall --no-deps opencv-python-headless
      - name: RF-DETR weights (cached)
        uses: actions/cache@v4
        with:
          path: ~/.roboflow/models
          key: rf-detr-large-2026
      - run: .venv/bin/python -c "from shottracer.detect import RfDetrBallDetector; RfDetrBallDetector()"
      - run: npm install -g npm@11 && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app
        run: |
          node scripts/dev.mjs --prod > app.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:3000 >/dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
      - run: npx playwright test
      - name: App log
        if: failure()
        run: cat app.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            app.log
